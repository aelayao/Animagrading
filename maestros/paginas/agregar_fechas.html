        </nav>

    </header>

    <section id="dentro">
        <div id="trapezio">
            <span>''</span>
        </div>

        <div class="trama">
            <span>''</span>
        </div>
        <h1 id="titulo">Fechas importantes</h1>

        <p class="subtitulo-formulario">Escoja los detalles de su evaluación:</p>

        <!-- Caja para AGREGAR una fecha -->
        
        <div class="caja-formulario-evaluacion">

            <!-- Fila 1: Fecha y Tipo (CORREGIDA) -->
            <div class="fila-formulario">
                <div class="grupo-campo">
                    <label for="campo-fecha">Fecha y hora:</label>
                    <input type="datetime-local" id="campo-fecha" class="entrada-formulario">
                </div>
                <div class="grupo-campo">
                    <label for="campo-tipo">Tipo de entrega:</label>
                    <select id="campo-tipo" class="entrada-formulario">
                        <option value="Proyecto">Proyecto</option>
                        <option value="Exposición">Exposición</option>
                        <option value="Examen">Examen</option>
                    </select>
                </div>
            </div>

            <!-- Fila 2: Grupo y Materia -->
            <div class="fila-formulario">
                <div class="grupo-campo">
                    <label for="campo-grupo">Grupo:</label>
                    <select id="campo-grupo" class="entrada-formulario">
                        <option value="9TMA">9°A TM</option>
                        <option value="9TMB">9°B TM</option>
                        <option value="8TV">8° TV</option>
                    </select>
                </div>
                <div class="grupo-campo">
                    <label for="campo-materia">Materia:</label>
                    <select id="campo-materia" class="entrada-formulario" disabled>
                        <option value="PRA">Producción Audiovisual</option>
                        <option value="ANA">Animación Avanzada</option>
                        <option value="SIM">Simulación 3D</option>
                    </select>
                </div>
            </div>

            
        </div>
        <div class="contenedor-boton-guardar">
                <a id="btn_volver">volver</a>
                <a class="btn-guardar-fecha" id="btn_guardar">guardar</a>
            </div>
    

    </section>

    <footer>
        <p>Tienes dudas o algun inconveniente? Contactanos: email@gmail.com</p>
        <a href="terminos_condic.html">Términos y condiciones</a>
    </footer>

        </a>
    </div>
