<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumno</title>

    <link rel="shortcut icon" href="../../general/imagen/icon/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../maestros/css/alumno.css">
</head>
<body>
    <header>

        <nav>
            <div id="pest_ini" class="nav_pest">
                <a  href="inicio.html">
                    <img src="../../general/imagen/icon/casa_gris.png" alt="ícono casa" class="icon_nav">
                    inicio
                </a>
            </div>
            <div id="pest_perf" class="nav_pest">
                <a href="../../general/paginas/perfil.html">
                    <img src="../../general/imagen/icon/perf_azul.png" alt="ícono perfil" id="perf" class="icon_nav"
                    onmouseover="this.src='../../general/imagen/icon/perf_azul_h.png';" onmouseout="this.src='../../general/imagen/icon/perf_azul.png';">
                    perfil
                </a>
            </div>
            <div id="pest_calif" class="nav_pest">
                <a  href="calificaciones.html">
                    <img src="../../general/imagen/icon/librt_verd.png" alt="ícono libreta" class="icon_nav"
                    onmouseover="this.src='../../general/imagen/icon/librt_verd_h.png';" onmouseout="this.src='../../general/imagen/icon/librt_verd.png';">
                    asignaciones
                </a>
            </div>
            <div id="pest_fecha" class="nav_pest">
                <a  href="fechas.html">
                    <img src="../../general/imagen/icon/cal_roj.png" alt="ícono calendario" class="icon_nav"
                    onmouseover="this.src='../../general/imagen/icon/cal_roj_h.png';" onmouseout="this.src='../../general/imagen/icon/cal_roj.png';">
                    fechas
                </a>
            </div>
            <a id="btn_logout" title="Salir de la cuenta"></a>
        </nav>

    </header>

    <section id="dentro">
        <div id="trapezio">   
            <span>''</span>
        </div>

        <div class="trama">
            <span>''</span>
        </div>
        <h1 id="titulo">Calificar a <span id="eqpo"></span></h1>

        <!-- Bloque de la Rúbrica -->
        <div class="seccion-rubrica">
            <h2 class="titulo-rubrica">Rubrica:</h2>
            <ul class="lista-evaluacion">
                <li><span id="rb1"></span><input type="number" class="caja-nota" id="nota1" min="0">/<span id="vl1"></span>%</li>
                <li><span id="rb2"></span><input type="number" class="caja-nota" id="nota2" min="0">/<span id="vl2"></span>%</li>
                <li><span id="rb3"></span><input type="number" class="caja-nota" id="nota3" min="0">/<span id="vl3"></span>%</li>
            </ul>
        </div>

        <!-- Bloque del "Calificacion total" -->
        <div class="seccion-total">
                <span class="texto-total">Calificación total:</span>
                <input type="text" class="caja-total" readonly id="calif_total">
            </div>

        <!-- Bloque de la Retroalimentacion -->
        <div class="seccion-retroalimentacion"> 
            <h2 class="titulo-retro">Retroalimentación (opcional):</h2>
            <textarea class="caja-retro" placeholder="......" id="retro"></textarea>
        </div>

        <!-- Bloque de los botones -->
        <div class="seccion-botones">
            <a id="btn_azul" class="btn-volver">volver</a>
            <button type="submit" class="btn-guardar" id="btn_guardar">guardar</button>
        </div>

        <!-- Ventana emergente de confirmación  -->
        <div id="modal-confirmacion" class="modal-fondo">
            <div class="modal-contenido">
                <!-- Botón de cerrar con la equis (x) -->
                <button type="button" class="btn-cerrar-modal">&times;</button>
        
            <!-- Texto del mensaje principal -->
            <h2 class="texto-modal">¡Cambios guardados con éxito!</h2>
            </div>
        </div>



        
    </section>

    <footer>
        <p>Tienes dudas o algun inconveniente? Contactanos: email@gmail.com</p>
    </footer>
    <div id="mini_iaev_cont">
        <a href="ayuda.html" id="burb_img">
            <span id="burbuja">¡Presioname si necesitas ayuda!</span>
            <img src="../../general/imagen/mini_iaev.png" alt="mini iaevsito" id="mini_iaev">
        </a>
    </div>

<script src="../js/alumno.js" type="module"></script>

</body>
</html>
