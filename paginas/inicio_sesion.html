<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="shortcut icon" href="/Animagrading/imagen/icon/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/Animagrading/css/inicio_ses.css">

</head>
<body>

    <section id="general">

        <div id="recuadro">
            <label for="inpt_matricula">Matrícula:</label>
            <input type="text"  id="inpt_matricula">
            <!--maxlength="8" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');"-->

            <label for="inpt_email">Correo electrónico:</label>
            <input type="email" inputmode="email" required id="inpt_email">

            <label for="inpt_pass">Contraseña:</label>
            <input type="password" required id="inpt_pass">
            
            <button id="btn_ingresar">Ingresar</button>
        </div>
    </section><div id="topimg"><img src="/Animagrading/imagen/anigrad_mid.png" alt="Animagrading logo mediano con sombra"></div>

    <script src="/Animagrading/js/inicio_ses.js" type="module"></script>
</body>
</html>
