<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="shortcut icon" href="/general/imagen/icon/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/general/css/registro.css">
</head>
<body>
    

    <section id="general">
        
        <div id="recuadro">
            <label for="inpt_nombre">Nombre:</label>
            <input type="text" id="inpt_nombre" required>
            <label for="inpt_nombre">Apellido paterno:</label>
            <input type="text" id="inpt_apllidp" required>

            <label for="inpt_matricula">Matrícula:</label>
            <input type="text" required id="inpt_matricula" minlength="8" maxlength="8" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');">

            <label for="slct_grupo">Grupo actual:</label>
            <select name="grupo" id="slct_grupo" required>
                <option value="9TMA">9°A TM</option>
                <option value="9TMB">9°B TM</option>
                <option value="8TV">8° TV</option>
            </select>

            <label for="inpt_email">Correo electrónico:</label>
            <input type="email" required id="inpt_email">

            <label for="inpt_pass">Contraseña (mínimo 7 caracteres):</label>
            <input type="password" required id="inpt_pass" minlength="7">
            
            <button id="btn_regis" >registrar cuenta</button>
        </div>
    </section>
    <div id="topimg"><img src="/general/imagen/anigrad_mid.png" alt="Animagrading logo mediano con sombra"></div>
    <script src="/general/js/registro.js" type="module"></script>

</body>
</html>
